<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Physics & Orbital Dynamics Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-gold: #d29922;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-main);
        }

        h1, h2, h3 {
            color: var(--accent-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 0;
        }

        .header-subtitle {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .layout-grid {
                grid-template-columns: 1.2fr 0.8fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Canvas & Controls */
        .canvas-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        canvas#orbitCanvas {
            display: block;
            width: 100%;
            cursor: pointer;
        }

        .controls-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background: #30363d;
            border-color: var(--accent-blue);
        }

        button.active {
            background: #238636;
            border-color: #2ea043;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        input[type=range] {
            flex-grow: 1;
        }

        /* Planet Info Panel */
        .planet-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .planet-badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .data-item {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .data-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
        }

        .data-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        .physics-box {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-blue);
            margin-top: 15px;
        }

        .equation {
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0;
            overflow-x: auto;
        }
